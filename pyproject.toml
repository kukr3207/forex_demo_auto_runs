[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-monitor"
version = "1.0.0"
description = "A deterministic foreign-exchange market data ingestion and analytics service"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Forex Demo Auto Run contributors" }]
keywords = ["forex", "market-data", "analytics", "alerts", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
forex-monitor = "forex_monitor.cli:main"

[project.urls]
Repository = "https://github.com/kukr3207/forex_demo_auto_run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["retail_data.txt"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.9"
packages = ["forex_monitor"]
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "integration: tests that exercise several service layers together",
]

[tool.coverage.run]
branch = true
source = ["forex_monitor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

