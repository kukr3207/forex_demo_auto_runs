name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Compile package
        run: python -m compileall -q src tests main.py

      - name: Check formatting
        run: ruff format --check src tests

      - name: Run lint rules
        run: ruff check src tests

      - name: Run type analysis
        run: mypy

      - name: Run tests with branch coverage
        run: pytest --cov=forex_monitor --cov-report=term-missing

      - name: Build source and wheel distributions
        run: python -m build

      - name: Upload package distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: forex-monitor-distributions
          path: dist/*
          if-no-files-found: error
